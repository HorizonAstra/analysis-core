<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Multiomics</title>
  <link rel="icon" href="/static/icons/mark.svg" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <div class="main-col">
      <header class="topbar">
        <div class="bar">
          <div class="left">
            <!-- mark + wordmark are one control: it opens the user/chats menu. The mark
                 is inline rather than an <img> so it takes its colour from the theme —
                 a file with the ink baked in disappears into a dark background. -->
            <button class="brandbtn" id="menuBtn" aria-haspopup="true" title="Chats">
              <svg class="mark" viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
                <rect width="32" height="32" rx="6" fill="currentColor"/>
                <path d="M9.5 22.5V9.5L16 17.5l6.5-8v13" fill="none" stroke="var(--paper)"
                      stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="brand">Multiomics</span>
              <svg class="brand-chev" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
                <path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <!-- The study scope sits beside the name because it says what the name is
                 currently about. Stays a word: it is the only control whose label is
                 data rather than a fixed noun. -->
            <button class="ghost scope" id="studyBtn"><span id="studyLabel">Studies</span></button>
          </div>
          <!-- Icons, not words. Each opens a surface that names itself. -->
          <div class="right">
            <button class="iconbtn" id="viewBtn" aria-label="Visualizers" title="Visualizers">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <path d="M4 4.5v15h15.5" fill="none" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round"/>
                <path d="M7.5 15.5l3.5-4.5 3 2.5 4.5-6" fill="none" stroke="currentColor"
                      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="iconbtn" id="verBtn" aria-label="Versions" title="Versions">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <path d="M12 3.5l8.5 4.5L12 12.5 3.5 8z" fill="none" stroke="currentColor"
                      stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M3.5 13l8.5 4.5 8.5-4.5" fill="none" stroke="currentColor"
                      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="iconbtn" id="panelToggle" aria-label="Results" title="Results">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none"
                      stroke="currentColor" stroke-width="1.5"/>
                <path d="M14 4.5v15" fill="none" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main id="scroll" class="scroll">
        <div class="wrap thread" id="thread"></div>
      </main>

      <footer class="composer">
        <div class="wrap">
          <form id="form" class="field">
            <textarea id="input" rows="1" placeholder="Ask about a study" autocomplete="off"></textarea>
            <button id="send" type="submit" aria-label="Send" disabled>
              <svg class="ic-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M12 19V5.5M6 11.5l6-6 6 6" fill="none" stroke="currentColor"
                      stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="ic-stop" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>
              </svg>
            </button>
          </form>
          <div class="hint">AI can make mistakes. Review results before relying on them.</div>
        </div>
      </footer>
    </div>

    <aside class="panel" id="panel" aria-label="Results">
      <div class="resize" id="resize"></div>
      <div class="panel-head">
        <span class="ph-title">Results</span>
        <span class="ph-count" id="phCount"></span>
      </div>
      <div class="panel-body">
        <!-- Work still going, wherever in the conversation it was started. One
             place for it, because a long chat scatters the same information
             across points too far apart to watch. Absent entirely when nothing
             is running, rather than an empty heading. -->
        <div class="going" id="going" hidden></div>
        <div class="tree" id="tree"></div>
        <div class="viewer" id="viewer" hidden></div>
      </div>
    </aside>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <!-- user + chats popup (opened by the wordmark) -->
  <div class="menu-pop" id="menuPop" hidden>
    <button class="mp-new" id="mpNew">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>
    <button class="mp-new" id="mpCaps">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 11.4v5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="7.6" r="1.05" fill="currentColor"/>
      </svg>
      <span>Capabilities</span>
    </button>
    <input class="mp-search" id="mpSearch" placeholder="Search" autocomplete="off" />
    <div class="mp-chats" id="mpChats"></div>
    <div class="mp-foot">
      <span class="mp-user" id="mpUser"></span>
      <button class="mp-theme" id="mpTheme" type="button"></button>
      <button class="mp-logout" id="mpLogout">Sign out</button>
    </div>
  </div>

  <!-- studies in scope for this chat. No heading: it hangs off the button that names it. -->
  <div class="menu-pop study-pop" id="studyPop" hidden>
    <div class="sp-list" id="spList"></div>
    <div class="sp-foot">
      <button class="sp-all" id="spAll" type="button">All</button>
      <span class="sp-count" id="spCount"></span>
    </div>
  </div>

  <!-- results that can be looked at rather than read -->
  <div class="menu-pop view-pop" id="viewPop" hidden>
    <div class="vw-list" id="vwList"></div>
  </div>

  <!-- which version of each result is in play. User-scoped, unlike the results
       panel: this answers "what do I have", which is about the data rather than
       about this conversation. -->
  <div class="info-overlay" id="verPop" hidden>
   <div class="info-card ver-card">
    <div class="pop-head">
      <div class="pop-title">Versions</div>
      <button class="ip-close" id="verClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="ver-body" id="verBody"></div>
    <div class="pop-foot" id="verFoot"></div>
   </div>
  </div>

  <div class="info-overlay" id="infoPop" hidden>
   <div class="info-card">
    <div class="pop-head">
      <div class="pop-title">Capabilities</div>
      <button class="ip-close" id="ipClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="ip-body" id="ipBody"></div>
   </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
