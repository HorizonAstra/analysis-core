# Shared settings for both build.sh (author) and restore.sh (exact rebuild).
# One place, so the two scripts can never disagree about what this env is.

PYTHON_VERSION=3.12

# The R packages HAllA imports through rpy2 at module load. Pinned by DATE, not by version:
# a dated CRAN snapshot always resolves the same versions, transitively, on any platform.
# Bump this date deliberately, then re-run build.sh and commit the regenerated lock.
CRAN_SNAPSHOT=https://packagemanager.posit.co/cran/2026-08-06
R_PACKAGES="XICOR eva"
